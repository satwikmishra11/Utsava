name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint (ESLint with jsx-a11y)
        run: npm run lint

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Unit & Integration Tests (Mocked LLM)
        run: npm test

      - name: Next.js Production Build
        run: npm run build
