name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint with jsx-a11y)
        run: npm run lint

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Unit & Integration Tests with Coverage Gate (85% overall, 90% domain & services)
        run: npm run test:coverage

      - name: CI Secret Scan
        run: bash scripts/secret-scan.sh

      - name: Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Next.js Production Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E & Axe Accessibility Tests (Fails on WCAG 2.2 Violations)
        run: npm run test:e2e
